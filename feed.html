<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daybird — Feed</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="index.html">Daybird<small>Feed</small></a>
  </header>
  <nav class="tabs">
    <a href="index.html">Brief</a>
    <a href="passes.html">Passes</a>
    <a href="feed.html">Feed</a>
    <a href="profile.html">Profile</a>
    <a href="host.html">Host land</a>
  </nav>

  <h1>What people saw.</h1>
  <div id="mystats"></div>
  <div class="card">
    <textarea id="text" rows="3" placeholder="What did you see this morning?"></textarea>
    <input id="tags" placeholder="tags, comma separated (spot, species)" style="margin-top:8px">
    <div style="margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button id="postBtn">Post</button><input type="file" id="photo" accept="image/*" style="width:auto"><span class="meta" id="photoMsg"></span></div>
  </div>
  <div id="feed"></div>
  <footer>Prototype: posts live in this browser only. A real feed needs a backend (see README).</footer>
</div>

<script src="data/mock.js"></script>
<script src="data/passes.js"></script>
<script src="data/feed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/cloud.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
  await DB.ready;
  const $ = (id) => document.getElementById(id);
  const likeMap = {};
  async function render() {
    const posts = await DB.loadFeed();
    posts.forEach(p => likeMap[p.id] = p.liked);
    $('feed').innerHTML = posts.map(p => `
      <div class="card feed-post">
        ${p.avatar ? `<img class="avatar" src="${p.avatar}" alt="" style="object-fit:cover">` : `<div class="avatar">${DB.esc((p.who || 'B')[0])}</div>`}
        <div class="body">
          <span class="who">${DB.esc(p.who)}</span><span class="when">${DB.ago(p.at)}</span>
          <div class="text">${DB.esc(p.text)}</div>
          ${p.photo ? `<img src="${p.photo}" alt="" style="max-width:100%;border-radius:10px;margin:4px 0 8px">` : ''}
          <div>${(p.tags||[]).map(t => `<span class="chip">#${DB.esc(t)}</span>`).join('')}</div>
          <div class="actions" style="margin-top:6px"><button class="${p.liked ? 'liked' : ''}" data-like="${p.id}">♥ ${p.likes}</button></div>
        </div>
      </div>`).join('');
  }
  render();
  document.addEventListener('daybird:refresh', render);
  if (!DB.online() && CLOUD.ready) $('mystats').insertAdjacentHTML('beforebegin', '<div class="banner">Sign in (top right) to post to the shared feed. Right now you are seeing sample posts.</div>');
  const L = await DB.lifeList(), P = await DB.profile();
  if (L) $('mystats').innerHTML = `<div class="card"><div class="stat"><div><b>${L.total}</b><span>life list</span></div><div><b>${L.yearList}</b><span>this year</span></div><div><b>${DB.esc(L.recentLifers[0].name)}</b><span>latest lifer</span></div>${P.favorite ? `<div><b>${DB.esc(P.favorite)}</b><span>favorite</span></div>` : ''}</div><a class="meta" href="profile.html">Edit profile →</a></div>`;
  else $('mystats').innerHTML = `<p class="meta"><a href="profile.html">Import your eBird list</a> to show your life-list stats here.</p>`;
  let photo = null;
  $('photo').onchange = async (e) => { if (e.target.files[0]) { photo = await DB.fileToDataURL(e.target.files[0]); $('photoMsg').textContent = 'photo attached'; } };
  $('postBtn').onclick = async () => {
    const t = $('text').value.trim(); if (!t && !photo) return;
    $('postBtn').disabled = true;
    await DB.post(t, $('tags').value.split(',').map(s => s.trim()).filter(Boolean), photo);
    $('text').value = ''; $('tags').value = ''; photo = null; $('photo').value = ''; $('photoMsg').textContent = ''; $('postBtn').disabled = false; render();
  };
  $('feed').addEventListener('click', async e => { const id = e.target.dataset.like; if (id) { await DB.toggleLike(id, likeMap[id]); render(); } });
})();
</script>
</body>
</html>
