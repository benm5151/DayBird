<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daybird — Settings</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6b4f">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="index.html">Daybird<small>Settings</small></a>
  </header>
  <nav class="tabs">
    <a href="index.html">Brief</a>
    <a href="id.html">ID</a>
    <a href="passes.html">Passes</a>
    <a href="feed.html">Feed</a>
    <a href="profile.html">Profile</a>
    <a href="host.html">Host land</a>
  </nav>

  <h1>Settings</h1>
  <div class="card">
    <label>Your name (for feed posts)</label><input id="name">
    <label>eBird API key (stays in this browser; never commit it)</label><input id="ebirdKey" type="password" placeholder="get one at ebird.org/api/keygen">
    <label>eBird display name (exactly as shown on your checklists, e.g. "Benjamin Morris")</label><input id="ebirdName" placeholder="Benjamin Morris">
    <label>Regions to watch for your checklists (eBird codes, comma separated)</label><input id="ebirdRegions" placeholder="US-NH,US-VT">
    <label>Location</label><button class="ghost small" id="geo" type="button">Use my current location</button>
    <label>Latitude</label><input id="lat" type="number" step="0.0001">
    <label>Longitude</label><input id="lng" type="number" step="0.0001">
    <label>Radius (km, max 50)</label><input id="dist" type="number" min="1" max="50">
    <label>Days back (1–30)</label><input id="back" type="number" min="1" max="30">
    <label>Last night's migration (from BirdCast, 0 = not set)</label>
    <select id="migration">
      <option value="0">Not set</option><option value="1">1 — very low</option><option value="2">2 — low</option>
      <option value="3">3 — moderate</option><option value="4">4 — high</option><option value="5">5 — very high</option>
    </select>
    <label>BirdCast local dashboard URL</label><input id="birdcastUrl">
    <div style="margin-top:12px"><button id="save">Save</button> <button class="ghost" id="reset">Reset bookings and posts</button></div>
    <p class="meta" id="msg"></p>
  </div>
</div>

<script src="data/mock.js"></script>
<script src="data/passes.js"></script>
<script src="data/feed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/cloud.js"></script>
<script src="js/app.js"></script>
<script>
const fields = ['name','ebirdKey','ebirdName','ebirdRegions','lat','lng','dist','back','migration','birdcastUrl'];
const s = DB.settings();
fields.forEach(f => document.getElementById(f).value = s[f]);
document.getElementById('save').onclick = () => {
  const n = {};
  fields.forEach(f => { const v = document.getElementById(f).value; n[f] = ['lat','lng','dist','back','migration'].includes(f) ? +v : v.trim(); });
  DB.saveSettings(n);
  document.getElementById('msg').textContent = 'Saved. Go back to the Brief.';
};
document.getElementById('geo').onclick = () => {
  if (!navigator.geolocation) return document.getElementById('msg').textContent = 'No geolocation on this device.';
  navigator.geolocation.getCurrentPosition(p => { document.getElementById('lat').value = p.coords.latitude.toFixed(4); document.getElementById('lng').value = p.coords.longitude.toFixed(4); document.getElementById('msg').textContent = 'Location filled in — hit Save.'; }, e => document.getElementById('msg').textContent = e.message);
};
document.getElementById('reset').onclick = () => {
  ['bookings','posts','likes','hostListings'].forEach(k => localStorage.removeItem('daybird:' + k));
  document.getElementById('msg').textContent = 'Cleared.';
};
</script>
</body>
</html>
